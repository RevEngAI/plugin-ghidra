name: build

on:
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ghidra 12.2 raised application.java.min/compiler to 25 and application.gradle.min to 9.1.
          - ghidra: "12.2"
            java: "25"
          - ghidra: "12.1.4"
            java: "21"
          - ghidra: "12.1.3"
            java: "21"
          - ghidra: "12.1.2"
            java: "21"
          - ghidra: "12.1"
            java: "21"
          - ghidra: "12.0.4"
            java: "21"
          - ghidra: "12.0.3"
            java: "21"
          - ghidra: "12.0.2"
            java: "21"
          - ghidra: "12.0.1"
            java: "21"
          - ghidra: "12.0"
            java: "21"
          - ghidra: "11.4.3"
            java: "21"
          - ghidra: "11.4.2"
            java: "21"
          - ghidra: "11.4.1"
            java: "21"
          - ghidra: "11.4"
            java: "21"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0

      - name: Install Ghidra ${{ matrix.ghidra }}
        uses: antoniovazquezblanco/setup-ghidra@df83bc5529d1b5d2d06537b25a8e65b36b0fa92f # v2.0.4
        with:
          auth_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.ghidra }}

      - name: Build
        run: ./gradlew buildExtension

      - name: Check SLA timestamps
        run: ls -l $GHIDRA_INSTALL_DIR/Ghidra/Processors/x86/data/languages/*

      - name: Precompile slaspec
        run: $GHIDRA_INSTALL_DIR/support/sleigh $GHIDRA_INSTALL_DIR/Ghidra/Processors/x86/data/languages/x86-64.slaspec

      - name: Run tests
        id: tests
        run: xvfb-run ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-ghidra-${{ matrix.ghidra }}
          path: build/reports/tests/test/

      - name: Publish test report
        id: report
        if: always()
        # Updating the check run right after creating it intermittently 404s, which failed jobs whose
        # tests had passed. Failing tests already fail "Run tests", so the report is display only.
        continue-on-error: true
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        with:
          name: Tests (Ghidra ${{ matrix.ghidra }})
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Complete a test report left in progress
        # When the reporter's update 404s, the check run it created stays "in progress" for good, so the PR never
        # shows all checks finished. Complete it with the outcome of the tests. Display only, like the report.
        if: always() && steps.report.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_NAME: Tests (Ghidra ${{ matrix.ghidra }})
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONCLUSION: ${{ steps.tests.outcome == 'success' && 'success' || 'failure' }}
        run: |
          summary="The test reporter could not attach the results to this check (HTTP 404). See the Run tests step and the test-results artifact."
          # The check run may not be visible to the API yet, which is what made the reporter's update fail
          for attempt in 1 2 3 4 5; do
            ids=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
                -f check_name="$CHECK_NAME" -f filter=all \
                --jq '.check_runs[] | select(.status != "completed") | .id') || ids=""
            completed=true
            for id in $ids; do
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" \
                  -f status=completed -f conclusion="$CONCLUSION" \
                  -f "output[title]=$CHECK_NAME" -f "output[summary]=$summary" >/dev/null || completed=false
            done
            if [ -n "$ids" ] && [ "$completed" = true ]; then
              echo "Completed '$CHECK_NAME' ($ids) as $CONCLUSION"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not find or complete an in-progress '$CHECK_NAME' check"
